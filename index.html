    <style>
        :root {
            --bg: #f3f5f7;
            --card: #ffffff;
            --ink: #1f2d3a;
            --muted: #6b7885;
            --line: #dde2e7;
            --head: #2f80c8;
            --head-ink: #ffffff;
            --g23: #d4edda;
            --g22: #fff3cd;
            --g21: #f8d7da;
            --g20: #d6e4ff;
            --g19: #e7d6ff;
            --glow: #e9eaec;
            --summary-bg: #eef1f4;
            --track-bg: #eef1f4;
            --thumb-in-bg: #2e7d32;
            --thumb-in-ink: #ffffff;
            --thumb-avail-bg: #d7e9f7;
            --thumb-avail-ink: #1c3d53;
            --thumb-out-bg: #d94545;
            --thumb-out-ink: #ffffff;
            --btn-bg: #2f80c8;
            --btn-ink: #ffffff;
            --shadow: 0 1px 2px rgba(16,24,32,.06), 0 4px 16px rgba(16,24,32,.06);

            --trackH: 168px;
            --thumbH: 40px;
            --editH: 40px;
            --gap: 6px;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #121518;
                --card: #1c2025;
                --ink: #e6e9ec;
                --muted: #98a3ad;
                --line: #313840;
                --head: #2c6ca3;
                --head-ink: #ffffff;
                --g23: #1f4a2e;
                --g22: #4a431f;
                --g21: #4a2626;
                --g20: #1e3356;
                --g19: #33224d;
                --glow: #2a2f35;
                --summary-bg: #23282e;
                --track-bg: #252b31;
                --thumb-in-bg: #2e7d32;
                --thumb-in-ink: #ffffff;
                --thumb-avail-bg: #2a4a63;
                --thumb-avail-ink: #d4eafc;
                --thumb-out-bg: #b23b3b;
                --thumb-out-ink: #ffecec;
                --btn-bg: #2c6ca3;
                --btn-ink: #ffffff;
                --shadow: 0 1px 2px rgba(0,0,0,.3);
            }
        }
        :root[data-theme="dark"] {
            --bg: #121518;
            --card: #1c2025;
            --ink: #e6e9ec;
            --muted: #98a3ad;
            --line: #313840;
            --head: #2c6ca3;
            --head-ink: #ffffff;
            --g23: #1f4a2e;
            --g22: #4a431f;
            --g21: #4a2626;
            --g20: #1e3356;
            --g19: #33224d;
            --glow: #2a2f35;
            --summary-bg: #23282e;
            --track-bg: #252b31;
            --thumb-in-bg: #2e7d32;
            --thumb-in-ink: #ffffff;
            --thumb-avail-bg: #2a4a63;
            --thumb-avail-ink: #d4eafc;
            --thumb-out-bg: #b23b3b;
            --thumb-out-ink: #ffecec;
            --btn-bg: #2c6ca3;
            --btn-ink: #ffffff;
            --shadow: 0 1px 2px rgba(0,0,0,.3);
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: max(16px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            background-color: var(--bg);
            color: var(--ink);
            font-size: 15px;
            line-height: 1.4;
        }
        button, input, select { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
        button { cursor: pointer; }
        :focus-visible { outline: 2px solid var(--head); outline-offset: 2px; }

        header { text-align: center; margin: 0 auto 14px; max-width: 1100px; }
        h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.2px; }
        .info { color: var(--muted); font-size: 13px; }
        .info b { color: var(--ink); font-weight: 600; }

        .layout { max-width: 1100px; margin: 0 auto; display: grid; gap: 14px; }
        .panel {
            background: var(--card); border-radius: 14px; padding: 14px 12px;
            box-shadow: var(--shadow); border: 1px solid var(--line);
            min-width: 0;
        }
        .panel h2 {
            margin: 0; font-size: 13px; font-weight: 700; text-transform: uppercase;
            letter-spacing: .6px; color: var(--muted);
        }
        .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
        .fmt.fmt-switch { margin: 0; flex: 0 1 200px; min-width: 132px; }
        .head-links { display: flex; gap: 12px; flex: 0 0 auto; }
        .fmt.fmt-switch button { padding: 6px 8px; }
        .fmt button:disabled { opacity: .45; cursor: not-allowed; }
        .link { background: none; border: none; color: var(--head); font-weight: 600; font-size: 14px; padding: 6px 2px; }

        .btn {
            background: var(--btn-bg); color: var(--btn-ink); border: none; border-radius: 10px;
            padding: 10px 16px; font-size: 15px; font-weight: 600; min-height: 44px;
        }
        .btn:hover { filter: brightness(1.08); }
        .btn.secondary { background: var(--track-bg); color: var(--ink); border: 1px solid var(--line); }
        .btn.secondary[aria-pressed="true"] { background: var(--thumb-in-bg); color: var(--thumb-in-ink); border-color: transparent; }

        /* Roster: one vertical slider per player, side by side */
        .players {
            list-style: none; margin: 0; padding: 0;
            display: grid; grid-template-columns: repeat(var(--n, 8), minmax(0, 72px)); justify-content: center; gap: var(--gap);
        }
        .prow { display: flex; flex-direction: column; align-items: stretch; min-width: 0; }
        .pname {
            font-size: 12px; font-weight: 600; text-align: center; margin-bottom: 4px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .sl-edit {
            height: var(--editH); margin: 0 0 8px; padding: 0;
            display: flex; align-items: center; justify-content: center; gap: 2px;
            border: 1px solid var(--line); border-radius: 10px;
            background: var(--card); font-size: 18px; font-weight: 700;
            user-select: none; -webkit-user-select: none;
        }
        .sl-edit .caret { font-size: 9px; color: var(--muted); font-weight: normal; }
        .sl-edit:hover { border-color: var(--head); }
        .sl-edit:active { background: var(--track-bg); }

        .seg {
            position: relative; height: var(--trackH);
            border-radius: 12px; background: var(--track-bg); border: 1px solid var(--line);
            touch-action: none; cursor: pointer; user-select: none; -webkit-user-select: none;
        }
        .seg.locked { opacity: .4; }
        .ghost, .thumb {
            position: absolute; left: 2px; right: 2px; height: var(--thumbH);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; text-transform: uppercase; letter-spacing: 0; white-space: nowrap; overflow: hidden;
            pointer-events: none;
        }
        .ghost { font-weight: 600; color: var(--muted); opacity: .5; }
        .ghost.in { top: 2px; }
        .ghost.avail { top: calc(50% - var(--thumbH) / 2); }
        .ghost.out { bottom: 2px; }
        .thumb {
            top: 2px; border-radius: 9px; font-weight: 700; z-index: 1;
            transition: top .12s ease, background-color .12s ease; box-shadow: 0 1px 3px rgba(0,0,0,.25);
        }
        .thumb.in { background: var(--thumb-in-bg); color: var(--thumb-in-ink); }
        .thumb.avail { background: var(--thumb-avail-bg); color: var(--thumb-avail-ink); top: calc(50% - var(--thumbH) / 2); }
        .thumb.out { background: var(--thumb-out-bg); color: var(--thumb-out-ink); top: calc(100% - var(--thumbH) - 2px); }
        @media (max-width: 599px) {
            .ghost, .thumb { left: 1px; right: 1px; font-size: 9px; letter-spacing: -.3px; }
        }

        /* Match night: each slider becomes a tall Put up button */
        .mctl { display: none; }
        .match-on .seg { display: none; }
        .match-on .mctl { display: flex; height: var(--trackH); }
        .match-on .sl-edit { pointer-events: none; border-style: dashed; }
        .match-on .sl-edit .caret { display: none; }
        .mbtn {
            flex: 1; border-radius: 12px; border: none; padding: 4px 2px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
            font-weight: 700; font-size: 11px; text-transform: uppercase; line-height: 1.2; text-align: center;
        }
        .mbtn.up { background: var(--btn-bg); color: var(--btn-ink); }
        .mbtn.played { background: var(--thumb-in-bg); color: var(--thumb-in-ink); }
        .mbtn.played b { font-size: 20px; }
        .mbtn.played small { font-size: 10px; font-weight: 600; opacity: .8; text-transform: lowercase; }
        .mbtn.off { background: var(--track-bg); color: var(--muted); border: 1px dashed var(--line); font-weight: 600; }

        .match {
            margin-bottom: 14px; padding: 12px; border-radius: 12px;
            background: var(--summary-bg); border: 1px solid var(--line);
        }
        .match-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
        .match-title b { font-size: 15px; }
        .match-title span { font-size: 13px; color: var(--muted); }
        .order { list-style: none; margin: 0 0 10px; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
        .order li {
            height: 52px; border-radius: 10px; border: 1px dashed var(--line); background: var(--card);
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; padding: 0 4px;
            color: var(--muted); font-size: 12px;
        }
        .order li.filled { border-style: solid; border-color: transparent; background: var(--thumb-in-bg); color: var(--thumb-in-ink); }
        .order li b { font-size: 17px; line-height: 1.1; }
        .order li span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
        .capbar { height: 8px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
        .capbar i { display: block; height: 100%; background: var(--thumb-in-bg); transition: width .2s ease; }
        .captext { font-size: 13px; color: var(--muted); margin-top: 8px; }
        .captext b { color: var(--ink); }

        .legend { font-size: 13px; color: var(--muted); margin: 14px 0 0; line-height: 1.5; }
        .legend b { color: var(--ink); }
        .legend s { color: var(--ink); }

        .controls {
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap;
        }
        .status { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 220px; min-width: 0; }
        .stat {
            display: inline-flex; align-items: baseline; gap: 5px; padding: 5px 10px;
            border-radius: 999px; background: var(--track-bg); font-size: 13px; color: var(--muted);
        }
        .stat b { color: var(--ink); font-size: 15px; }
        .stat.count { background: var(--head); color: var(--head-ink); }
        .stat.count b { color: var(--head-ink); }
        .note { flex-basis: 100%; font-size: 13px; color: var(--thumb-out-bg); font-weight: 600; }
        .actions { display: flex; gap: 8px; }

        /* Picker */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,.45);
            display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
        }
        .picker {
            background: var(--card); color: var(--ink); border-radius: 16px; padding: 18px;
            width: min(320px, 100%); text-align: center; box-shadow: 0 8px 28px rgba(0,0,0,.35);
        }
        .picker h4 { margin: 0 0 14px; font-size: 16px; }
        .picker .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .pick {
            padding: 16px 0; font-size: 22px; font-weight: 700;
            border: 1px solid var(--line); border-radius: 12px;
            background: var(--track-bg);
        }
        .pick:hover { border-color: var(--head); }
        .pick.sel { background: var(--thumb-in-bg); color: var(--thumb-in-ink); border-color: transparent; }
        .picker .cancel { margin-top: 12px; font-size: 15px; color: var(--muted); background: none; border: none; padding: 10px 16px; }

        /* Results */
        .results-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
        .pill-toggle {
            border: 1px solid var(--line); background: var(--track-bg); color: var(--muted);
            border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600;
        }
        .pill-toggle[aria-pressed="true"] { background: var(--head); color: var(--head-ink); border-color: transparent; }
        .toast {
            position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
            background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px;
            font-size: 14px; font-weight: 600; z-index: 60; box-shadow: 0 4px 16px rgba(0,0,0,.25);
            max-width: calc(100% - 32px); text-align: center;
        }
        .table-wrap { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
        th, td { padding: 6px 2px; text-align: center; vertical-align: middle; border-bottom: 1px solid var(--line); }
        tbody tr:last-child td { border-bottom: none; }
        th {
            background-color: var(--head); color: var(--head-ink); font-weight: 700; font-size: 12px;
            text-transform: uppercase; letter-spacing: .4px; position: sticky; top: 0; z-index: 2;
        }
        th.c-idx { width: 30px; }
        th.c-tot { width: 46px; }
        td.idx { color: var(--muted); font-size: 12px; }
        td.tot { font-weight: 800; font-size: 17px; }
        td .sl { display: block; font-size: 16px; font-weight: 600; line-height: 1.2; }
        td .nm { display: block; font-size: 11px; color: var(--muted); line-height: 1.25; overflow-wrap: anywhere; }
        td.locked .sl { text-decoration: underline 2px var(--thumb-in-bg); text-underline-offset: 3px; }
        td.locked .nm { color: var(--ink); font-weight: 600; }
        .total-23 { background-color: var(--g23); }
        .total-22 { background-color: var(--g22); }
        .total-21 { background-color: var(--g21); }
        .total-20 { background-color: var(--g20); }
        .total-19 { background-color: var(--g19); }
        .total-low { background-color: var(--glow); }
        .empty { text-align: center; color: var(--muted); padding: 24px 8px; font-size: 14px; }

        .summary { margin-top: 12px; padding: 12px; background-color: var(--summary-bg); border-radius: 10px; font-size: 14px; }
        .summary h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
        .totals { display: flex; flex-wrap: wrap; gap: 6px; }
        .tchip {
            display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px;
            border-radius: 999px; border: 1px solid var(--line); font-size: 13px; background: var(--card);
        }
        .tchip .swatch { width: 22px; height: 18px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; border: 1px solid var(--line); }

        /* Roster setup */
        .setup-wrap { max-width: 560px; margin: 0 auto; }
        .setup h2 { margin-bottom: 8px; }
        .hint { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
        .fmt { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 3px; border-radius: 12px; background: var(--track-bg); border: 1px solid var(--line); margin-bottom: 14px; }
        .fmt button { border: none; background: none; border-radius: 9px; padding: 9px; font-weight: 600; color: var(--muted); }
        .fmt button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
        .setup-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
        .setup-list li {
            display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 6px 8px; align-items: center;
            grid-template-areas: "num name name remove" ". s8 s9 .";
        }
        .setup-list li + li { padding-top: 8px; border-top: 1px solid var(--line); }
        .setup-list .num { grid-area: num; }
        .setup-list .name { grid-area: name; }
        .setup-list .sl[data-fmt="8"] { grid-area: s8; }
        .setup-list .sl[data-fmt="9"] { grid-area: s9; }
        .setup-list .remove { grid-area: remove; }
        @media (min-width: 600px) {
            .setup-list li { grid-template-columns: 22px minmax(0, 1fr) 132px 132px 44px; grid-template-areas: "num name s8 s9 remove"; }
            .setup-list li + li { padding-top: 0; border-top: none; }
        }
        .num { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
        .setup-list input, .setup-list select {
            height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
            padding: 0 10px; font-size: 16px; width: 100%; min-width: 0;
        }
        .setup-list select { font-weight: 600; font-size: 15px; padding: 0 6px; }
        .remove { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: none; color: var(--muted); font-size: 20px; line-height: 1; }
        .remove:hover:not(:disabled) { color: var(--thumb-out-bg); border-color: var(--thumb-out-bg); }
        .remove:disabled { opacity: .35; cursor: default; }
        .add { margin-top: 10px; width: 100%; height: 44px; border-radius: 10px; border: 1px dashed var(--line); background: none; color: var(--head); font-weight: 600; }
        .warn { color: var(--thumb-out-bg); font-weight: 600; font-size: 14px; margin: 10px 0 0; min-height: 0; }
        .warn:empty { display: none; }
        .setup-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .setup-actions .btn { min-width: 120px; }
        .storage-note { margin: 12px 0 0; font-size: 12px; color: var(--muted); text-align: right; }

        /* Footer: share, support, gear, privacy. Sits below both views. */
        footer {
            max-width: 1100px; margin: 28px auto 0; padding-top: 16px; border-top: 1px solid var(--line);
            color: var(--muted); font-size: 13px; display: grid; gap: 14px;
        }
        .foot-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 18px; text-align: center; }
        .foot-row a, .foot-row .link { color: var(--head); font-weight: 600; text-decoration: none; font-size: 13px; padding: 6px 0; }
        .foot-row a:hover { text-decoration: underline; }
        .foot-row .sep { color: var(--line); }
        .gear {
            background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 12px; box-shadow: var(--shadow);
        }
        .gear h2 { margin: 0 0 4px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
        .gear p { margin: 0 0 12px; color: var(--muted); }
        .gear ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
        .gear a {
            display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 10px;
            border: 1px solid var(--line); background: var(--track-bg); color: var(--ink); text-decoration: none; min-height: 44px;
        }
        .gear a:hover { border-color: var(--head); }
        .gear a b { font-size: 14px; }
        .gear a span { font-size: 12px; color: var(--muted); }
        .gear .disclosure { margin: 10px 0 0; font-size: 11px; }

        /* Small phones */
        @media (max-width: 380px) {
            body { padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right)); }
            .panel { padding-left: 10px; padding-right: 10px; }
            :root { --gap: 3px; --trackH: 156px; }
            .ghost, .thumb { font-size: 8px; }
            .pname { font-size: 10px; }
            .sl-edit { font-size: 16px; }
            .sl-edit .caret { display: none; }
        }

        @media (min-width: 600px) {
            body { padding-top: max(24px, env(safe-area-inset-top)); }
            h1 { font-size: 26px; }
            .panel { padding: 18px; }
            :root { --gap: 10px; --trackH: 180px; }
            .ghost, .thumb { font-size: 11px; letter-spacing: .3px; }
            .pname { font-size: 13px; }
        }

        /* Desktop: controls pinned left, results right */
        @media (min-width: 1024px) {
            body { padding: 32px 24px; }
            header { margin-bottom: 20px; }
            .layout { grid-template-columns: minmax(500px, 560px) 1fr; gap: 20px; align-items: start; }
            :root { --gap: 8px; }
            .ghost, .thumb { letter-spacing: 0; }
            .roster { position: sticky; top: 20px; }
            .results { max-height: calc(100vh - 40px); display: flex; flex-direction: column; position: sticky; top: 20px; }
            .table-wrap { overflow: auto; flex: 1 1 auto; min-height: 120px; }
            .summary { flex: 0 0 auto; }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="title">APA Lineup Planner</h1>
        <div class="info" id="info"></div>
    </header>

    <main class="layout" id="planView" hidden>
        <section class="panel roster" id="rosterPanel" aria-label="Roster">
            <div class="panel-head">
                <div class="fmt fmt-switch" id="fmtSwitch" role="group" aria-label="Tonight's format">
                    <button type="button" data-fmt="8">8-Ball</button><button type="button" data-fmt="9">9-Ball</button>
                </div>
                <div class="head-links">
                    <button class="link" id="shareRoster" type="button">Share</button>
                    <button class="link" id="editRoster" type="button">Edit roster</button>
                </div>
            </div>
            <div class="match" id="matchPanel" hidden></div>
            <ul class="players" id="players"></ul>
            <p class="legend" id="legend"></p>

            <div class="controls">
                <div class="status" id="status" aria-live="polite"></div>
                <div class="actions">
                    <button class="btn secondary" id="matchToggle" type="button" aria-pressed="false">Match night</button>
                    <button class="btn" id="reset" type="button">Reset</button>
                </div>
            </div>
        </section>

        <section class="panel results" aria-label="Lineups">
            <div class="results-head">
                <h2>Legal lineups</h2>
                <button class="pill-toggle" id="namesToggle" type="button" aria-pressed="false">Show names</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th class="c-idx">#</th><th>P1</th><th>P2</th><th>P3</th><th>P4</th><th>P5</th><th class="c-tot">Tot</th></tr>
                    </thead>
                    <tbody id="lineups"></tbody>
                </table>
            </div>
            <div class="summary" id="summary"></div>
        </section>
    </main>

    <main class="setup-wrap" id="setupView" hidden></main>

    <footer>
        <section class="gear" id="gear" hidden aria-label="Gear"></section>
        <div class="foot-row">
            <button class="link" id="sharePlanner" type="button">Share this planner</button>
            <a id="supportLink" href="#" target="_blank" rel="noopener" hidden></a>
            <a href="privacy.html">Privacy</a>
        </div>
        <div class="foot-row">
            <span>Free tool built by an APA league player. Not affiliated with or endorsed by the American Poolplayers Association.</span>
        </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <div class="overlay" id="overlay" hidden>
        <div class="picker" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
            <h4 id="pickerTitle">Set skill level</h4>
            <div class="grid" id="pickerGrid"></div>
            <button class="cancel" id="pickerCancel" type="button">Cancel</button>
        </div>
    </div>

    <script>
        const STORE_KEY = 'apa-lineup-planner:v1';
        const CAP = 23;
        // APA senior rule: at most 2 players of SL 6 or higher can play in one team match.
        const SENIOR_SL = 6, MAX_SENIORS = 2;
        const isSenior = (sl) => sl >= SENIOR_SL;
        const TEAM_SIZE = 5;
        const MIN_ROSTER = 5, MAX_ROSTER = 8;
        const FORMATS = {
            '8': { label: '8-Ball', min: 2, max: 7 },
            '9': { label: '9-Ball', min: 1, max: 9 },
        };
        const STATE_TEXT = { in: 'In', avail: 'Maybe', out: 'Out' };
        const STATE_ORDER = ['in', 'avail', 'out'];

        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const uid = () => Math.random().toString(36).slice(2, 10);
        const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
        const range = (lo, hi) => Array.from({ length: hi - lo + 1 }, (_, k) => lo + k);

        // Saved data: { format, players: [{ id, name, sls: { 8: SL|null, 9: SL|null }, state }], match: { on, played: [ids in order] } }
        // format is tonight's format; a player with no SL for it sits out of the calculator.
        function cleanSL(v, fmt) {
            const n = parseInt(v, 10);
            const f = FORMATS[fmt];
            return Number.isFinite(n) ? clamp(n, f.min, f.max) : null;
        }
        function load() {
            try {
                const d = JSON.parse(localStorage.getItem(STORE_KEY));
                if (!d || !FORMATS[d.format] || !Array.isArray(d.players)) return null;
                const players = d.players.slice(0, MAX_ROSTER).map((p, i) => {
                    // older saves had a single sl for the saved format
                    const raw = p.sls || { [d.format]: p.sl };
                    return {
                        id: String(p.id || uid()),
                        name: String(p.name || `Player ${i + 1}`).slice(0, 20),
                        sls: { 8: cleanSL(raw[8], '8'), 9: cleanSL(raw[9], '9') },
                        state: STATE_ORDER.includes(p.state) ? p.state : 'avail',
                    };
                });
                if (players.length < MIN_ROSTER) return null;
                const ids = new Set(players.map(p => p.id));
                const m = d.match || {};
                const played = (Array.isArray(m.played) ? m.played : []).filter(id => ids.has(id)).slice(0, TEAM_SIZE);
                return { format: d.format, players, match: { on: !!m.on, played }, showNames: d.showNames === true };
            } catch (_) {
                return null;
            }
        }
        function save() {
            try { localStorage.setItem(STORE_KEY, JSON.stringify(app)); } catch (_) {}
        }

        let app = load();

        // Players who have a skill level in tonight's format; all lineup math runs on this list.
        let act = [];
        const SL = (p) => p.sls[app.format];
        function activate() { act = app.players.filter(p => SL(p) != null); }

        function allIndexCombos(n, size) {
            const out = [];
            (function rec(start, acc) {
                if (acc.length === size) { out.push(acc.slice()); return; }
                for (let i = start; i <= n - (size - acc.length); i++) {
                    acc.push(i); rec(i + 1, acc); acc.pop();
                }
            })(0, []);
            return out;
        }

        // Players who must be in every lineup: marked In, plus anyone already put up tonight.
        function forcedIdx() {
            const forced = new Set();
            act.forEach((p, i) => { if (p.state === 'in') forced.add(i); });
            if (app.match.on) {
                app.match.played.forEach(id => {
                    const i = act.findIndex(p => p.id === id);
                    if (i >= 0) forced.add(i);
                });
            }
            return forced;
        }

        // Can the forced players be completed to a full lineup without breaking the cap or the senior rule?
        // Fills the open spots with the lowest available skill levels. Seniors are the highest levels,
        // so that same fill also uses the fewest seniors possible.
        function feasible(forced) {
            if (forced.size > TEAM_SIZE) return false;
            let total = 0, seniors = 0;
            forced.forEach(i => { const v = SL(act[i]); total += v; if (isSenior(v)) seniors++; });
            const fillers = act
                .filter((p, i) => !forced.has(i) && p.state !== 'out')
                .map(SL)
                .sort((a, b) => a - b);
            const k = TEAM_SIZE - forced.size;
            if (fillers.length < k) return false;
            for (let t = 0; t < k; t++) { total += fillers[t]; if (isSenior(fillers[t])) seniors++; }
            return total <= CAP && seniors <= MAX_SENIORS;
        }

        // Lineups are grouped by their skill levels (e.g. 7,6,5,3,2). Within a group,
        // a slot either names one player who's in every version, or lists the
        // interchangeable players at that skill level.
        function slotsFor(group, forced) {
            const P = act;
            const slots = [];
            for (const v of new Set(group.sls)) {
                const need = group.sls.filter(x => x === v).length;
                const members = new Set();
                group.combos.forEach(c => c.forEach(i => { if (SL(P[i]) === v) members.add(i); }));
                const fixed = [...members].filter(i => group.combos.every(c => c.includes(i)));
                const flex = [...members].filter(i => !fixed.includes(i));
                fixed.forEach(i => slots.push({ sl: v, count: 1, names: [P[i].name], locked: forced.has(i) }));
                const rest = need - fixed.length;
                if (rest > 0) slots.push({ sl: v, count: rest, names: flex.map(i => P[i].name), locked: false });
            }
            return slots;
        }

        function compute() {
            const P = act;
            const forced = forcedIdx();
            const groups = new Map();
            if (forced.size <= TEAM_SIZE) {
                for (const combo of allIndexCombos(P.length, TEAM_SIZE)) {
                    if (combo.some(i => P[i].state === 'out' && !forced.has(i))) continue;
                    if ([...forced].some(i => !combo.includes(i))) continue;
                    const total = combo.reduce((a, i) => a + SL(P[i]), 0);
                    if (total > CAP) continue;
                    if (combo.filter(i => isSenior(SL(P[i]))).length > MAX_SENIORS) continue;
                    const sls = combo.map(i => SL(P[i])).sort((a, b) => b - a);
                    const key = sls.join(',');
                    if (!groups.has(key)) groups.set(key, { key, sls, total, combos: [] });
                    groups.get(key).combos.push(combo);
                }
            }
            const results = [...groups.values()].map(g => ({ ...g, slots: slotsFor(g, forced) }));
            results.sort((a, b) => b.total - a.total || b.key.localeCompare(a.key));
            return { results, forced };
        }

        function totalClass(total) {
            return total >= 19 && total <= 23 ? `total-${total}` : 'total-low';
        }

        // ---------- Plan view ----------
        const rows = [];
        let canBeIn = [];
        let canPutUp = [];

        function setState(i, s) {
            if (s === 'in' && !canBeIn[i]) s = 'avail'; // can't lock In under the cap
            if (act[i].state !== s) { act[i].state = s; save(); refresh(); }
        }

        function buildRows() {
            const ul = $('players');
            activate();
            ul.innerHTML = '';
            ul.style.setProperty('--n', act.length);
            rows.length = 0;
            act.forEach((p, i) => {
                const li = document.createElement('li');
                li.className = 'prow';
                li.innerHTML =
                    `<span class="pname"></span>` +
                    `<button class="sl-edit" type="button"></button>` +
                    `<div class="seg" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="2">` +
                    `<span class="ghost in">In</span><span class="ghost avail">Maybe</span><span class="ghost out">Out</span>` +
                    `<span class="thumb"></span></div>` +
                    `<div class="mctl"></div>`;
                const name = li.querySelector('.pname');
                const edit = li.querySelector('.sl-edit');
                const seg = li.querySelector('.seg');
                const thumb = li.querySelector('.thumb');
                const mctl = li.querySelector('.mctl');
                name.textContent = p.name;
                name.title = p.name;
                edit.addEventListener('click', () => { if (!app.match.on) openPicker(i); });

                const apply = (clientY) => {
                    const rect = seg.getBoundingClientRect();
                    const frac = (clientY - rect.top) / rect.height;
                    setState(i, frac < 0.34 ? 'in' : frac > 0.66 ? 'out' : 'avail');
                };
                let dragging = false;
                seg.addEventListener('pointerdown', (e) => {
                    dragging = true;
                    try { seg.setPointerCapture(e.pointerId); } catch (_) {}
                    apply(e.clientY); e.preventDefault();
                    seg.focus({ preventScroll: true });
                });
                seg.addEventListener('pointermove', (e) => { if (dragging) apply(e.clientY); });
                seg.addEventListener('pointerup', (e) => { dragging = false; try { seg.releasePointerCapture(e.pointerId); } catch (_) {} });
                seg.addEventListener('pointercancel', () => { dragging = false; });
                seg.addEventListener('keydown', (e) => {
                    const pos = STATE_ORDER.indexOf(act[i].state);
                    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') setState(i, STATE_ORDER[Math.max(0, pos - 1)]);
                    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') setState(i, STATE_ORDER[Math.min(2, pos + 1)]);
                    else return;
                    e.preventDefault();
                });

                mctl.addEventListener('click', (e) => {
                    const id = act[i].id;
                    if (e.target.closest('.mbtn.up')) {
                        if (!app.match.played.includes(id) && app.match.played.length < TEAM_SIZE) app.match.played.push(id);
                    } else if (e.target.closest('.mbtn.played')) {
                        app.match.played = app.match.played.filter(x => x !== id);
                    } else return;
                    save(); refresh();
                });

                ul.appendChild(li);
                rows.push({ edit, seg, thumb, mctl });
            });
        }

        function renderMatchPanel(played) {
            const P = act;
            const byId = Object.fromEntries(P.map(p => [p.id, p]));
            const used = played.reduce((a, id) => a + SL(byId[id]), 0);
            const left = CAP - used;
            const spots = TEAM_SIZE - played.length;
            const eligible = P.filter((p, i) => !played.includes(p.id) && p.state !== 'out' && canPutUp[i]);
            const seniors = played.filter(id => isSenior(SL(byId[id]))).length;
            let text;
            if (seniors > MAX_SENIORS) text = `<b>${seniors}</b> seniors played &middot; <b>max is ${MAX_SENIORS}</b>, undo a pick`;
            else if (used > CAP) text = `<b>${used}</b> of ${CAP} &middot; <b>over the cap</b>, undo a pick`;
            else if (spots === 0) text = `Lineup complete &middot; <b>${used}</b> of ${CAP}`;
            else {
                text = `<b>${used}</b> of ${CAP} used &middot; <b>${left}</b> left for ${spots} player${spots === 1 ? '' : 's'} &middot; seniors <b>${seniors}</b> of ${MAX_SENIORS}`;
                if (eligible.length) text += ` &middot; next can be up to <b>SL ${Math.max(...eligible.map(SL))}</b>`;
                else text += ` &middot; <b>no one left fits</b>, undo a pick or change who's In`;
            }
            $('matchPanel').innerHTML =
                `<div class="match-title"><b>Match night</b><span>${played.length} of ${TEAM_SIZE} played</span></div>` +
                `<ol class="order">` +
                range(0, TEAM_SIZE - 1).map(k => {
                    const p = byId[played[k]];
                    return p
                        ? `<li class="filled"><b>${SL(p)}</b><span>${esc(p.name)}</span></li>`
                        : `<li>${k + 1}</li>`;
                }).join('') +
                `</ol>` +
                `<div class="capbar"><i style="width:${Math.min(100, used / CAP * 100)}%"></i></div>` +
                `<div class="captext">${text}</div>`;
        }

        function refresh() {
            const P = act;
            const { results, forced } = compute();
            canBeIn = P.map((_, i) => forced.has(i) || feasible(new Set([...forced, i])));
            // Unlike canBeIn, this also fails for In players when the forced group itself no longer fits.
            canPutUp = P.map((_, i) => feasible(new Set([...forced, i])));

            const matchOn = app.match.on;
            const played = matchOn ? app.match.played : [];
            const fmtLabel = FORMATS[app.format].label;
            const missing = app.players.length - P.length;
            $('title').textContent = `APA ${fmtLabel} Lineup Planner`;
            $('info').innerHTML = `${P.length} players` +
                (missing ? ` (${missing} without a ${fmtLabel} SL)` : '') +
                ` &nbsp;&middot;&nbsp; Cap <b>${CAP}</b> &nbsp;&middot;&nbsp; Max <b>${MAX_SENIORS}</b> seniors (SL ${SENIOR_SL}+)`;
            $('fmtSwitch').querySelectorAll('[data-fmt]').forEach(b => {
                b.setAttribute('aria-pressed', String(b.dataset.fmt === app.format));
                b.disabled = matchOn && b.dataset.fmt !== app.format;
            });
            $('fmtSwitch').title = matchOn ? 'End match night to switch formats' : '';

            $('rosterPanel').classList.toggle('match-on', matchOn);
            $('matchPanel').hidden = !matchOn;
            if (matchOn) renderMatchPanel(played);
            const toggle = $('matchToggle');
            toggle.textContent = matchOn ? 'End match' : 'Match night';
            toggle.setAttribute('aria-pressed', String(matchOn));
            $('legend').innerHTML = matchOn
                ? 'Tap <b>Put up</b> as each player goes to the table; tap a played player to undo. <b>No fit</b> means putting them up would break the 23 cap or the 2-senior limit.'
                : 'Tap a skill level to change it. Drag or tap a slider to mark each player <b>In</b> (definitely playing), <b>Maybe</b> or <b>Out</b>. A <b>greyed</b> slider can\'t be set to In &mdash; it would break the 23 cap or the 2-senior limit (SL 6+).';

            rows.forEach((r, i) => {
                const p = P[i];
                const s = p.state;
                r.thumb.className = `thumb ${s}`;
                r.thumb.textContent = STATE_TEXT[s];
                // grey the slider when this player can't be locked In under the cap
                r.seg.classList.toggle('locked', s === 'avail' && !canBeIn[i]);
                r.seg.setAttribute('aria-label', `${p.name}, skill level ${SL(p)}`);
                r.seg.setAttribute('aria-orientation', 'vertical');
                r.seg.setAttribute('aria-valuenow', String(STATE_ORDER.indexOf(s)));
                r.seg.setAttribute('aria-valuetext', STATE_TEXT[s]);
                r.edit.innerHTML = `${SL(p)} <span class="caret">&#9662;</span>`;
                r.edit.setAttribute('aria-label', `${p.name} skill level ${SL(p)}`);
                if (matchOn) {
                    const pos = played.indexOf(p.id);
                    if (pos >= 0) r.mctl.innerHTML = `<button class="mbtn played" type="button" aria-label="Undo ${esc(p.name)}"><b>#${pos + 1}</b><small>undo</small></button>`;
                    else if (s === 'out') r.mctl.innerHTML = `<span class="mbtn off">Out</span>`;
                    else if (played.length >= TEAM_SIZE) r.mctl.innerHTML = `<span class="mbtn off">Sit</span>`;
                    else if (!canPutUp[i]) r.mctl.innerHTML = `<span class="mbtn off">No<br>fit</span>`;
                    else r.mctl.innerHTML = `<button class="mbtn up" type="button" aria-label="Put up ${esc(p.name)}">Put<br>up</button>`;
                }
            });

            const count = (st) => P.filter(p => p.state === st).length;
            const inCount = count('in'), outCount = count('out'), availCount = count('avail');
            const notOut = P.length - outCount;
            let note = '';
            const forcedSeniors = [...forced].filter(i => isSenior(SL(P[i]))).length;
            if (forced.size > TEAM_SIZE) note = `Too many set to In (max ${TEAM_SIZE})`;
            else if (forcedSeniors > MAX_SENIORS) note = `Too many seniors (SL ${SENIOR_SL}+) set to In &mdash; max ${MAX_SENIORS}`;
            else if (P.length < TEAM_SIZE) note = `Only ${P.length} player${P.length === 1 ? ' has' : 's have'} a ${fmtLabel} skill level &mdash; add more in Edit roster`;
            else if (notOut < TEAM_SIZE) note = `Need ${TEAM_SIZE} available (have ${notOut})`;
            const n = results.length;
            $('status').innerHTML =
                `<span class="stat count"><b>${n}</b> lineup${n === 1 ? '' : 's'}</span>` +
                `<span class="stat">In <b>${inCount}</b></span>` +
                `<span class="stat">Maybe <b>${availCount}</b></span>` +
                `<span class="stat">Out <b>${outCount}</b></span>` +
                (note ? `<span class="note">${note}</span>` : '');

            const namesBtn = $('namesToggle');
            namesBtn.setAttribute('aria-pressed', String(app.showNames));
            namesBtn.textContent = app.showNames ? 'Hide names' : 'Show names';

            $('lineups').innerHTML = n === 0
                ? `<tr><td class="empty" colspan="7">No lineups match the current selection.</td></tr>`
                : results.map((r, idx) => {
                    // one cell per seat, lowest skill level first
                    const cells = [];
                    r.slots.forEach(sl => { for (let k = 0; k < sl.count; k++) cells.push(sl); });
                    cells.sort((a, b) => a.sl - b.sl);
                    return `<tr class="${totalClass(r.total)}"><td class="idx">${idx + 1}</td>` +
                        cells.map(c => `<td${c.locked ? ' class="locked"' : ''}><span class="sl">${c.sl}</span>` +
                            (app.showNames ? `<span class="nm">${c.names.map(esc).join('/<wbr>')}</span>` : '') + `</td>`).join('') +
                        `<td class="tot">${r.total}</td></tr>`;
                }).join('');

            const totals = {};
            results.forEach(r => { totals[r.total] = (totals[r.total] || 0) + 1; });
            let html = '<h3>Lineups by total</h3><div class="totals">';
            if (n) {
                Object.keys(totals).sort((a, b) => b - a).forEach(t => {
                    html += `<span class="tchip"><span class="swatch ${totalClass(+t)}">${t}</span><b>${totals[t]}</b>${+t === CAP ? ' &middot; max' : ''}</span>`;
                });
            } else {
                html += '<span class="tchip">None</span>';
            }
            $('summary').innerHTML = html + '</div>';
        }

        $('reset').addEventListener('click', () => {
            app.players.forEach(p => { p.state = 'avail'; });
            app.match.played = [];
            save(); refresh();
        });

        $('matchToggle').addEventListener('click', () => {
            if (app.match.on) {
                if (app.match.played.length && !confirm('End match night? This clears who has played.')) return;
                app.match = { on: false, played: [] };
            } else {
                app.match = { on: true, played: [] };
            }
            save(); refresh();
        });

        $('editRoster').addEventListener('click', () => openSetup());

        $('fmtSwitch').addEventListener('click', (e) => {
            const b = e.target.closest('[data-fmt]');
            if (!b || b.disabled || b.dataset.fmt === app.format) return;
            app.format = b.dataset.fmt;
            save();
            buildRows();
            refresh();
        });

        function showPlan() {
            $('setupView').hidden = true;
            $('planView').hidden = false;
            buildRows();
            refresh();
        }

        // ---------- Roster setup ----------
        let draft = null;

        function openSetup() {
            draft = app
                ? { players: app.players.map(p => ({ id: p.id, name: p.name, sls: { ...p.sls } })) }
                : { players: range(1, MIN_ROSTER).map(() => ({ id: uid(), name: '', sls: { 8: null, 9: null } })) };
            $('planView').hidden = true;
            $('setupView').hidden = false;
            $('title').textContent = app ? `APA ${FORMATS[app.format].label} Lineup Planner` : 'APA Lineup Planner';
            $('info').textContent = app ? 'Edit your roster' : 'Plan legal lineups under the 23 cap';
            renderSetup();
            window.scrollTo(0, 0);
        }

        function renderSetup(focusLast) {
            const first = !app;
            const slSelect = (p, i, fmt) => {
                const f = FORMATS[fmt];
                return `<select class="sl" data-fmt="${fmt}" aria-label="Player ${i + 1} ${f.label} skill level">` +
                    `<option value=""${p.sls[fmt] == null ? ' selected' : ''}>No ${f.label}</option>` +
                    range(f.min, f.max).map(v => `<option value="${v}"${v === p.sls[fmt] ? ' selected' : ''}>${f.label} SL ${v}</option>`).join('') +
                    `</select>`;
            };
            $('setupView').innerHTML =
                `<section class="panel setup">` +
                `<h2>${first ? 'Set up your team' : 'Edit roster'}</h2>` +
                `<p class="hint">${first ? 'Add your players with their 8-ball and 9-ball skill levels. Choose &ldquo;No&rdquo; for a format they don&rsquo;t play. It&rsquo;s saved on this device, so you only do this once.' : 'Players keep separate 8-ball and 9-ball skill levels. Changes are saved on this device.'}</p>` +
                `<ol class="setup-list">` +
                draft.players.map((p, i) =>
                    `<li data-i="${i}"><span class="num">${i + 1}</span>` +
                    `<input class="name" type="text" maxlength="20" autocomplete="off" autocapitalize="words" enterkeyhint="next" placeholder="Player ${i + 1}" value="${esc(p.name)}" aria-label="Player ${i + 1} name">` +
                    slSelect(p, i, '8') + slSelect(p, i, '9') +
                    `<button type="button" class="remove" aria-label="Remove player ${i + 1}"${draft.players.length <= 1 ? ' disabled' : ''}>&times;</button></li>`
                ).join('') +
                `</ol>` +
                (draft.players.length < MAX_ROSTER ? `<button type="button" class="add">+ Add player</button>` : '') +
                `<p class="warn" id="setupWarn"></p>` +
                `<div class="setup-actions">` +
                (first ? '' : `<button type="button" class="btn secondary cancel">Cancel</button>`) +
                `<button type="button" class="btn save">${first ? 'Start planning' : 'Save roster'}</button>` +
                `</div>` +
                `</section>`;
            if (focusLast) {
                const inputs = $('setupView').querySelectorAll('.name');
                inputs[inputs.length - 1].focus();
            }
        }

        $('setupView').addEventListener('input', (e) => {
            const li = e.target.closest('li[data-i]');
            if (li && e.target.classList.contains('name')) draft.players[+li.dataset.i].name = e.target.value;
        });
        $('setupView').addEventListener('change', (e) => {
            const li = e.target.closest('li[data-i]');
            if (li && e.target.classList.contains('sl')) {
                draft.players[+li.dataset.i].sls[e.target.dataset.fmt] = e.target.value === '' ? null : +e.target.value;
            }
        });
        $('setupView').addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' || !e.target.classList.contains('name')) return;
            e.preventDefault();
            const inputs = [...$('setupView').querySelectorAll('.name')];
            const next = inputs[inputs.indexOf(e.target) + 1];
            if (next) next.focus(); else e.target.blur();
        });
        $('setupView').addEventListener('click', (e) => {
            const t = e.target;
            if (t.closest('.remove')) {
                draft.players.splice(+t.closest('li').dataset.i, 1);
                renderSetup();
            } else if (t.closest('.add')) {
                draft.players.push({ id: uid(), name: '', sls: { 8: null, 9: null } });
                renderSetup(true);
            } else if (t.closest('.cancel')) {
                showPlan();
            } else if (t.closest('.save')) {
                if (draft.players.length < MIN_ROSTER) {
                    $('setupWarn').textContent = `Add at least ${MIN_ROSTER} players to build a lineup.`;
                    return;
                }
                const unrated = draft.players.findIndex(d => d.sls[8] == null && d.sls[9] == null);
                if (unrated >= 0) {
                    const d = draft.players[unrated];
                    $('setupWarn').textContent = `Give ${d.name.trim() || `Player ${unrated + 1}`} an 8-ball or 9-ball skill level.`;
                    return;
                }
                const old = app ? Object.fromEntries(app.players.map(p => [p.id, p])) : {};
                const players = draft.players.map((d, i) => ({
                    id: d.id,
                    name: d.name.trim() || `Player ${i + 1}`,
                    sls: { ...d.sls },
                    state: old[d.id] ? old[d.id].state : 'avail',
                }));
                // first time: start on whichever format more players have a rating for
                const rated = (fmt) => players.filter(p => p.sls[fmt] != null).length;
                const format = app ? app.format : (rated('9') > rated('8') ? '9' : '8');
                const ids = new Set(players.map(p => p.id));
                const match = app ? app.match : { on: false, played: [] };
                match.played = match.played.filter(id => ids.has(id));
                app = { format, players, match, showNames: app ? app.showNames : false };
                save();
                showPlan();
                window.scrollTo(0, 0);
            }
        });

        // ---------- Skill-level picker ----------
        let editIndex = null;
        const overlay = $('overlay');
        const pickerGrid = $('pickerGrid');

        function openPicker(i) {
            editIndex = i;
            const f = FORMATS[app.format];
            const p = act[i];
            $('pickerTitle').textContent = `${p.name} — ${f.label} skill level`;
            pickerGrid.innerHTML = range(f.min, f.max)
                .map(v => `<button type="button" class="pick${v === SL(p) ? ' sel' : ''}" data-v="${v}">${v}</button>`).join('');
            overlay.hidden = false;
            (pickerGrid.querySelector('.sel') || pickerGrid.firstChild).focus({ preventScroll: true });
        }
        function closePicker() {
            const i = editIndex;
            overlay.hidden = true; editIndex = null;
            if (i !== null && rows[i]) rows[i].edit.focus({ preventScroll: true });
        }
        pickerGrid.addEventListener('click', (e) => {
            const b = e.target.closest('.pick');
            if (!b || editIndex === null) return;
            act[editIndex].sls[app.format] = +b.dataset.v;
            save(); refresh();
            closePicker();
        });
        overlay.addEventListener('click', (e) => { if (e.target === overlay) closePicker(); });
        $('pickerCancel').addEventListener('click', closePicker);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !overlay.hidden) closePicker(); });

        $('namesToggle').addEventListener('click', () => {
            app.showNames = !app.showNames;
            save(); refresh();
        });

        // ---------- Share roster as a link ----------
        // The roster rides in the URL fragment (#roster=...), which browsers never send to the server.
        // Payload: { v: 1, p: [[name, sl8|null, sl9|null], ...] } as base64url JSON.
        function encodeRoster() {
            const json = JSON.stringify({ v: 1, p: app.players.map(p => [p.name, p.sls[8], p.sls[9]]) });
            const bytes = new TextEncoder().encode(json);
            let bin = '';
            bytes.forEach(b => { bin += String.fromCharCode(b); });
            return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }
        function decodeRoster(code) {
            try {
                const bin = atob(code.replace(/-/g, '+').replace(/_/g, '/'));
                const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
                if (!d || d.v !== 1 || !Array.isArray(d.p) || d.p.length < MIN_ROSTER || d.p.length > MAX_ROSTER) return null;
                const players = d.p.map((row, i) => ({
                    id: uid(),
                    name: String((row && row[0]) || `Player ${i + 1}`).slice(0, 20),
                    sls: { 8: cleanSL(row && row[1], '8'), 9: cleanSL(row && row[2], '9') },
                    state: 'avail',
                }));
                if (players.some(p => p.sls[8] == null && p.sls[9] == null)) return null;
                return players;
            } catch (_) {
                return null;
            }
        }

        let toastTimer = null;
        function toast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.hidden = false;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
        }

        $('shareRoster').addEventListener('click', async () => {
            const url = `${location.origin}${location.pathname}#roster=${encodeRoster()}`;
            if (navigator.share) {
                try {
                    // Only title + url: the iOS/macOS share sheet's "Copy" appends any `text` to the URL, producing a broken link.
                    await navigator.share({ title: 'Our roster — APA Lineup Planner', url });
                } catch (_) { /* share sheet dismissed */ }
                return;
            }
            try {
                await navigator.clipboard.writeText(url);
                toast('Roster link copied');
            } catch (_) {
                prompt('Copy this link to share your roster:', url);
            }
        });

        // ---------- Share the planner itself (no roster attached) ----------
        // Always share the canonical address (from <link rel="canonical">), not whatever URL this copy was opened from.
        $('sharePlanner').addEventListener('click', async () => {
            const canonical = document.querySelector('link[rel="canonical"]');
            const url = (canonical && canonical.href) || `${location.origin}${location.pathname}`;
            if (navigator.share) {
                // No `text` field: the share sheet's "Copy" would append it to the URL (see roster share above).
                try { await navigator.share({ title: 'APA Lineup Planner — free 23-rule lineup calculator', url }); } catch (_) { /* dismissed */ }
                return;
            }
            try {
                await navigator.clipboard.writeText(url);
                toast('Link copied');
            } catch (_) {
                prompt('Copy this link to share the planner:', url);
            }
        });

        // ---------- Support + gear links ----------
        // Fill these in once the accounts exist (see LAUNCH_PLAN.md). Anything left empty is simply not shown.
        const LINKS = {
            // Ko-fi / Buy Me a Coffee page, e.g. 'https://ko-fi.com/yourname'
            support: { url: 'https://ko-fi.com/thadrazdow', label: 'Buy me a rack ☕' },
            // Affiliate links. Keep it to 3–4 things you actually use; honest one-liners convert better than a catalog.
            gear: {
                title: 'Gear I actually use',
                intro: 'A few things that live in my case. If you buy through these links the site gets a small cut, at no cost to you.',
                items: [
                    // { name: 'Kamui 0.98 chalk', note: 'Lasts a whole session, barely any mess.', url: 'https://amzn.to/...' },
                    // { name: 'Predator Second Skin glove', note: 'Humid bar? No problem.', url: 'https://amzn.to/...' },
                    // { name: 'Tip Pik tip tool', note: 'The $8 fix for a glazed tip.', url: 'https://amzn.to/...' },
                ],
            },
        };
        function renderFooterLinks() {
            const support = $('supportLink');
            if (LINKS.support.url) { support.href = LINKS.support.url; support.textContent = LINKS.support.label; support.hidden = false; }
            const items = LINKS.gear.items.filter(i => i && i.url);
            const gear = $('gear');
            if (!items.length) return;
            gear.innerHTML =
                `<h2>${esc(LINKS.gear.title)}</h2><p>${esc(LINKS.gear.intro)}</p>` +
                `<ul>${items.map(i => `<li><a href="${esc(i.url)}" target="_blank" rel="noopener sponsored"><b>${esc(i.name)}</b><span>${esc(i.note || '')}</span></a></li>`).join('')}</ul>` +
                `<p class="disclosure">As an Amazon Associate I earn from qualifying purchases.</p>`;
            gear.hidden = false;
        }
        renderFooterLinks();

        // Returns true if a shared roster in the URL was loaded.
        function importFromHash() {
            const m = location.hash.match(/^#roster=([A-Za-z0-9_-]+)$/);
            if (!m) return false;
            history.replaceState(null, '', location.pathname + location.search);
            const players = decodeRoster(m[1]);
            if (!players) { toast("That roster link didn't work"); return false; }
            const names = players.map(p => p.name).join(', ');
            if (app && !confirm(`Replace your roster with the shared one?\n\n${names}`)) return false;
            const rated = (fmt) => players.filter(p => p.sls[fmt] != null).length;
            app = {
                format: app ? app.format : (rated('9') > rated('8') ? '9' : '8'),
                players,
                match: { on: false, played: [] },
                showNames: app ? app.showNames : false,
            };
            save();
            toast(`Loaded ${players.length} players`);
            return true;
        }
        window.addEventListener('hashchange', () => { if (importFromHash()) showPlan(); });

        importFromHash();
        if (app) showPlan(); else openSetup();

        if ('serviceWorker' in navigator && location.protocol === 'https:') {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
